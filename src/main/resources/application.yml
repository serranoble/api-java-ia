server:
  port: 8080

spring:
  application:
    name: products-api
  datasource:
    url: jdbc:sqlite:products.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.qa.practice: INFO
